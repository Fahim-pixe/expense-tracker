name: Native Kotlin Android

on:
  push:
    branches: [main]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: Build and verify signed native APK/AAB artifacts using repository secrets
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Unit, lint, and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate wrapper build and Room schema export
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test lint assembleDebug assembleDebugAndroidTest
      - name: Upload reports and generated Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kotlin-build-reports
          path: |
            android-kotlin/app/build/reports/**
            android-kotlin/app/schemas/**
          if-no-files-found: warn

  instrumentation:
    name: Room and Compose instrumentation
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run instrumentation tests on API 29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            cd android-kotlin && chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kotlin-instrumentation-reports
          path: android-kotlin/app/build/reports/androidTests/**
          if-no-files-found: warn

  signed-release:
    name: Signed release security verification
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_release
    needs: [build, instrumentation]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kotlin
    env:
      NATIVE_ANDROID_KEYSTORE_BASE64: ${{ secrets.NATIVE_ANDROID_KEYSTORE_BASE64 }}
      NATIVE_ANDROID_KEY_ALIAS: ${{ secrets.NATIVE_ANDROID_KEY_ALIAS }}
      NATIVE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NATIVE_ANDROID_KEYSTORE_PASSWORD }}
      NATIVE_ANDROID_KEY_PASSWORD: ${{ secrets.NATIVE_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate signing inputs
        run: |
          test -n "$NATIVE_ANDROID_KEYSTORE_BASE64"
          test -n "$NATIVE_ANDROID_KEY_ALIAS"
          test -n "$NATIVE_ANDROID_KEYSTORE_PASSWORD"
          test -n "$NATIVE_ANDROID_KEY_PASSWORD"
      - name: Build and verify signed release artifacts
        run: |
          mkdir -p build/secure-signing
          printf '%s' "$NATIVE_ANDROID_KEYSTORE_BASE64" | base64 --decode > build/secure-signing/release.jks
          chmod 600 build/secure-signing/release.jks
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PnativeReleaseStoreFile="$PWD/build/secure-signing/release.jks" \
            -PnativeReleaseKeyAlias="$NATIVE_ANDROID_KEY_ALIAS" \
            -PnativeReleaseStorePassword="$NATIVE_ANDROID_KEYSTORE_PASSWORD" \
            -PnativeReleaseKeyPassword="$NATIVE_ANDROID_KEY_PASSWORD" \
            assembleRelease bundleRelease
          "$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-kotlin-signed-release
          path: |
            android-kotlin/app/build/outputs/apk/release/app-release.apk
            android-kotlin/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
