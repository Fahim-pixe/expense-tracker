name: Native Kotlin Android

on:
  push:
    branches: [main]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:

jobs:
  build:
    name: Unit, lint, and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate wrapper build and Room schema export
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test lint assembleDebug assembleDebugAndroidTest
      - name: Upload reports and generated Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kotlin-build-reports
          path: |
            android-kotlin/app/build/reports/**
            android-kotlin/app/schemas/**
          if-no-files-found: warn

  instrumentation:
    name: Room and Compose instrumentation
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run instrumentation tests on API 29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            cd android-kotlin
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kotlin-instrumentation-reports
          path: android-kotlin/app/build/reports/androidTests/**
          if-no-files-found: warn
